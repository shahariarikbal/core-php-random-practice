version: "3"

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass          # ✅ Required to use root
      MYSQL_DATABASE: auth_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    restart: always
    environment:
      PMA_HOST: db                           # ✅ Must match service name
      PMA_USER: user
      PMA_PASSWORD: password
    ports:
      - "4500:80"

  web:
    build: .
    restart: always
    volumes:
      - ./src:/var/www/html
    ports:
      - "8080:80"

volumes:
  db_data:
